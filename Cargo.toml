[package]
name = "arch-cast"
version = "0.2.0"
edition = "2024"
description = "A keyboard-first native launcher for Arch Linux and Hyprland"

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4.5", features = ["derive"] }
freedesktop-icons = "0.4"
gpui = { package = "gpui-kit", version = "=0.8.0" }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smol = "2"
tempfile = "3"
unicode-normalization = "0.1"
url = "2"
walkdir = "2"

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.8.0", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true
lto = "thin"
